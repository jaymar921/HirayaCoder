name: Verify

# The full check, on all three platforms. Called by `ci.yml` on every push and by
# `release.yml` before it packages anything, so a release can never be built from code
# that has not passed on the platform it will be installed on.
#
# It lives in its own file because duplicating the matrix is how the two copies drift,
# and this matrix is the project's only evidence about macOS and Linux — the
# maintainer's machines are Windows.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports, rather than the first failure hiding the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The extension declares `node >= 18`; 20 is the LTS closest to what VS Code
          # 1.85+ ships in its extension host.
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # A real VS Code is ~330 MB, so it is worth caching — but carefully.
      #
      # Restore and save are split on purpose. `actions/cache` would otherwise persist
      # the tree even when the job failed, and there are no partial-credit outcomes
      # here: a half-extracted macOS app bundle looks like a cache hit and then fails
      # with a bare ENOENT on a binary inside it. There are also no `restore-keys`, so
      # a near-miss can never be layered underneath a fresh download.
      #
      # Only the downloaded editor is cached. The throwaway profile is deliberately
      # left out, so no state survives between runs.
      - name: Restore the VS Code download
        id: vscode-cache
        uses: actions/cache/restore@v4
        with:
          path: .vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package.json') }}

      # Linux runners have no display and the integration suite launches a real editor.
      # macOS and Windows runners already have a session.
      - name: Integration tests (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration

      # Saved only after the editor has actually been used to run a suite, so a broken
      # download is never promoted into the cache for every later run to trip over.
      - name: Save the VS Code download
        if: success() && steps.vscode-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package.json') }}

      # The shipped tree has no production dependencies, so this stays at zero. Dev-only
      # advisories are reviewed in security/sast-report-*.md and must not block a
      # release, which is why this is scoped rather than a bare `npm audit`.
      - name: Production dependency audit
        run: npm run audit:security
